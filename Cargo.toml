[workspace]
members = ["crates/macros", "crates/shader", "examples/sprites"]

[package]
name = "synaga"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Native Rust to Naga transpiler"
license = "MIT"
repository = "https://github.com/kvark/synaga"
readme = "README.md"

[features]
# Print the module as WGSL. Off unless a client asks: the IR is the product,
# and Naga's WGSL frontend and backend are not part of producing it.
wgsl = ["naga/wgsl-in", "naga/wgsl-out"]

[dependencies]
# For `NAGA_MAJOR`, which the generated file asserts against the reader's: a
# module is written by one Naga and read by another, and a mismatch is otherwise
# a panic at the first `decode`. Only the constant is wanted, so the features
# that pull in serde and bincode are off.
synaga-shader = { path = "crates/shader", default-features = false }
naga = { version = "30", features = ["serialize"] }
bincode = { version = "2", default-features = false, features = ["std", "serde"] }
# `span-locations` is what lets an error say which line it is about. Features
# are additive, so this also turns it on for the copy `syn` pulls in.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "parsing", "printing", "visit"] }
quote = "1"
thiserror = "2"

[dev-dependencies]
# Reading back what the build step writes, as a host does. The `bytemuck` feature
# is what `Shared` derives, and a shared struct cannot be compiled without it.
synaga-shader = { path = "crates/shader", features = ["bytemuck"] }
naga = { version = "30", features = ["deserialize"] }
