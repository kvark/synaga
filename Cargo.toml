[workspace]
members = ["crates/macros", "crates/shader", "examples/sprites"]

[package]
name = "synaga"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Native Rust to Naga transpiler"
license = "MIT"
repository = "https://github.com/kvark/synaga"
readme = "README.md"

[features]
# Print the module as WGSL. Off unless a client asks: the IR is the product,
# and Naga's WGSL frontend and backend are not part of producing it.
wgsl = ["naga/wgsl-in", "naga/wgsl-out"]

[dependencies]
naga = { version = "30", features = ["serialize"] }
serde_json = "1"
# `span-locations` is what lets an error say which line it is about. Features
# are additive, so this also turns it on for the copy `syn` pulls in.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "parsing"] }
thiserror = "2"
