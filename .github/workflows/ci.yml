name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tests run on whatever stable is current, without -D warnings: a new
  # release should be able to warn about this code without failing the build
  # that proves it still works.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The WGSL printer is optional. These tests read what it prints.
      - run: cargo test --workspace --features wgsl
      # The example crate wires a build script up for real: its shader modules
      # are type-checked by rustc and serialized by the build script, so this
      # failing means the documented workflow is broken however green the unit
      # tests are.
      - run: cargo run -p sprites

  # Lints are held to a pinned toolchain, so a new lint in a future Rust
  # release turns this red only when someone bumps the version on purpose.
  # Floating stable plus -D warnings breaks CI on code nobody touched.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features wgsl -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check --workspace --all-targets --features wgsl
